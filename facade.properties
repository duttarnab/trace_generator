# Path to the FACADE checkout (https://github.com/google/facade) used for training and scoring.
# Override with -Dfacade.dir=... or the FACADE_DIR environment variable.
facade.dir=/Users/arnabdutta/Projects/facade

# Python with FACADE dependencies. Default: <facade.dir>/env/bin/python if present, else python3.
# facade.python=/path/to/python

# Directory for all generated files (traces, JSONL, TFRecords, model, scores). Relative to the project root.
output.dir=output

# Conversion
facade.actionKinds=AUTHORIZATION_DECISION
facade.outcomes=ALLOW,SUCCESS
facade.peerAttrs=execution
facade.timeSource=signed_at

# Training
facade.trainingExamples=20000
# Last fraction of the action time span used for scoring. Set facade.testStart (ISO instant) to override.
facade.testFraction=0.2

# Windows in seconds, or "auto" to derive them from the time span of the data.
facade.snapshotSeconds=auto
facade.historySeconds=auto
facade.lookbackSeconds=auto
facade.dedupSeconds=auto

# false: only convert, do not run FACADE.
facade.run=true
